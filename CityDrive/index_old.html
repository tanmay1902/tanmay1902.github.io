<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityDrive 3D - Indian Street Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #050505;
            color: #fff;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .hud-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .hud-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #94a3b8;
        }
        .hud-value {
            font-size: 28px;
            font-weight: 800;
            color: #f59e0b;
            font-family: monospace;
        }
        #settings-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
            z-index: 10;
        }
        #settings-toggle-btn:hover {
            background: rgba(30, 41, 59, 0.95);
        }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            padding: 10px 24px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 13px;
            color: #cbd5e1;
            pointer-events: none;
        }
        /* Settings Modal */
        #settings-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 20;
        }
        #settings-menu.active {
            opacity: 1;
            pointer-events: auto;
        }
        .settings-card {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 28px;
            border-radius: 12px;
            width: 380px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }
        .settings-card h2 {
            font-size: 22px;
            color: #f59e0b;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }
        .setting-group {
            margin-bottom: 18px;
        }
        .setting-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 6px;
        }
        .setting-val {
            font-weight: bold;
            color: #38bdf8;
            font-family: monospace;
        }
        .setting-slider {
            width: 100%;
            accent-color: #f59e0b;
            cursor: pointer;
        }
        .settings-close-btn {
            width: 100%;
            background: #d97706;
            color: white;
            border: none;
            padding: 10px;
            margin-top: 10px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .settings-close-btn:hover {
            background: #b45309;
        }
        /* Game Over Screen */
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 30;
        }
        #game-over.active {
            opacity: 1;
            pointer-events: auto;
        }
        #game-over h1 {
            font-size: 48px;
            color: #ef4444;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #game-over p {
            color: #94a3b8;
            margin-bottom: 24px;
        }
        #restart-btn {
            background: #d97706;
            color: white;
            border: none;
            padding: 12px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #restart-btn:hover {
            background: #b45309;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <button id="settings-toggle-btn" onclick="toggleSettings()">⚙️ Settings [ESC]</button>

    <div id="hud">
        <div class="hud-card">
            <div class="hud-label">Speed</div>
            <div class="hud-value"><span id="speed-val">0</span> <small style="font-size:14px">KM/H</small></div>
        </div>
        <div class="hud-card">
            <div class="hud-label">Score</div>
            <div class="hud-value" id="score-val">0</div>
        </div>
    </div>

    <div id="controls-hint">
        [W / Up] Accelerate &nbsp;|&nbsp; [S / Down] Brake &nbsp;|&nbsp; [A/D or Left/Right] Steer &nbsp;|&nbsp; [ESC] Settings
    </div>

    <!-- Settings Menu Overlay -->
    <div id="settings-menu">
        <div class="settings-card">
            <h2>Vehicle Settings</h2>
            
            <div class="setting-group">
                <div class="setting-header">
                    <span>Acceleration Rate</span>
                    <span id="accel-disp" class="setting-val">0.004</span>
                </div>
                <input type="range" id="accel-slider" class="setting-slider" min="0.001" max="0.020" step="0.001" value="0.004">
            </div>

            <div class="setting-group">
                <div class="setting-header">
                    <span>Top Speed (KM/H)</span>
                    <span id="speed-disp" class="setting-val">224</span>
                </div>
                <input type="range" id="speed-slider" class="setting-slider" min="0.6" max="2.5" step="0.1" value="1.4">
            </div>

            <div class="setting-group">
                <div class="setting-header">
                    <span>Steering Response</span>
                    <span id="steer-disp" class="setting-val">0.003</span>
                </div>
                <input type="range" id="steer-slider" class="setting-slider" min="0.001" max="0.010" step="0.0005" value="0.003">
            </div>

            <div class="setting-group">
                <div class="setting-header">
                    <span>Friction (Coasting Stop)</span>
                    <span id="frict-disp" class="setting-val">0.002</span>
                </div>
                <input type="range" id="frict-slider" class="setting-slider" min="0.001" max="0.010" step="0.001" value="0.002">
            </div>

            <button class="settings-close-btn" onclick="toggleSettings()">Resume Driving</button>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over">
        <h1>CRASHED!</h1>
        <p>Final Score: <span id="final-score">0</span></p>
        <button id="restart-btn" onclick="resetGame()">Drive Again</button>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x1a150e, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Lighting (Warm Indian Sunset Theme)
        const ambientLight = new THREE.AmbientLight(0xfff1e6, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffb703, 1.2);
        dirLight.position.set(30, 50, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 200;
        dirLight.shadow.camera.left = -40;
        dirLight.shadow.camera.right = 40;
        dirLight.shadow.camera.top = 40;
        dirLight.shadow.camera.bottom = -40;
        scene.add(dirLight);

        // Textures setup
        const textureLoader = new THREE.TextureLoader();

        // 1. Building Texture
        const buildingTexture = textureLoader.load('https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/red_brick_plaster/red_brick_plaster_diff_2k.jpg');
        buildingTexture.wrapS = THREE.RepeatWrapping;
        buildingTexture.wrapT = THREE.RepeatWrapping;
        buildingTexture.repeat.set(2, 4);

        const buildingMaterial = new THREE.MeshStandardMaterial({
            map: buildingTexture,
            roughness: 0.8
        });

        // 2. Car Body Metallic Texture
        const carTexture = textureLoader.load('https://dl.polyhaven.org/file/ph-assets/Textures/jpg/2k/flaky_painted_metal/flaky_painted_metal_diff_2k.jpg');
        const carMaterial = new THREE.MeshStandardMaterial({
            map: carTexture,
            metalness: 0.5,
            roughness: 0.3
        });
        const roadDiffuse = textureLoader.load('textures/road_damaged_2_diff_4k.jpg');
        roadDiffuse.wrapS = THREE.RepeatWrapping;
        roadDiffuse.wrapT = THREE.RepeatWrapping;
        roadDiffuse.repeat.set(1, 60);

        const roadMaterial = new THREE.MeshStandardMaterial({
            map: roadDiffuse,
            roughness: 0.7,
            metalness: 0.1
        });

        const ROAD_WIDTH = 16;
        const ROAD_LENGTH = 1200;

        // Main Road
        const roadGeo = new THREE.PlaneGeometry(ROAD_WIDTH, ROAD_LENGTH);
        const road = new THREE.Mesh(roadGeo, roadMaterial);
        road.rotation.x = -Math.PI / 2;
        road.position.z = -ROAD_LENGTH / 2 + 20;
        road.receiveShadow = true;
        scene.add(road);

        // Side Pavements
        const paveMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.9 });
        const paveGeo = new THREE.BoxGeometry(4, 0.4, ROAD_LENGTH);
        
        const leftPave = new THREE.Mesh(paveGeo, paveMat);
        leftPave.position.set(-ROAD_WIDTH/2 - 2, 0.2, -ROAD_LENGTH / 2 + 20);
        scene.add(leftPave);

        const rightPave = new THREE.Mesh(paveGeo, paveMat);
        rightPave.position.set(ROAD_WIDTH/2 + 2, 0.2, -ROAD_LENGTH / 2 + 20);
        scene.add(rightPave);

        // --- Side-by-Side Indian Buildings & Event Decor Generation ---
        const buildingsGroup = new THREE.Group();
        const buildingColors = [0xdeab90, 0xcd9777, 0xe6ccb2, 0xddb892, 0xb08968, 0x9c6644];
        const eventColors = [0xd97706, 0xdc2626, 0x16a34a, 0x7c3aed];

        function createIndianBuilding(x, z) {
            const group = new THREE.Group();
            const width = 8 + Math.random() * 4;
            const height = 12 + Math.random() * 18;
            const depth = 10 + Math.random() * 6;

            const baseColor = buildingColors[Math.floor(Math.random() * buildingColors.length)];
            const bMat = new THREE.MeshStandardMaterial({ color: baseColor, roughness: 0.8 });
            const bGeo = new THREE.BoxGeometry(width, height, depth);
            const building = new THREE.Mesh(bGeo, bMat);
            building.position.set(0, height / 2, 0);
            building.castShadow = true;
            building.receiveShadow = true;
            group.add(building);

            const archGeo = new THREE.CylinderGeometry(width / 3, width / 3, 2, 8);
            const archMat = new THREE.MeshStandardMaterial({ color: 0x8d0801, roughness: 0.5 });
            const arch = new THREE.Mesh(archGeo, archMat);
            arch.position.set(0, height + 1, 0);
            group.add(arch);

            const bannerMat = new THREE.MeshBasicMaterial({ color: eventColors[Math.floor(Math.random() * eventColors.length)] });
            const bannerGeo = new THREE.BoxGeometry(width * 0.9, 1.8, 0.2);
            const banner = new THREE.Mesh(bannerGeo, bannerMat);
            banner.position.set(0, 3, (depth / 2) + 0.11);
            group.add(banner);

            group.position.set(x, 0, z);
            return group;
        }

        const buildingSpacing = 16;
        for (let z = 0; z > -ROAD_LENGTH; z -= buildingSpacing) {
            const leftB = createIndianBuilding(-ROAD_WIDTH / 2 - 8, z);
            buildingsGroup.add(leftB);

            const rightB = createIndianBuilding(ROAD_WIDTH / 2 + 8, z);
            buildingsGroup.add(rightB);

            if (Math.abs(z) % 80 === 0 && z !== 0) {
                const archBannerGeo = new THREE.BoxGeometry(ROAD_WIDTH + 4, 1.5, 0.2);
                const archBannerMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.4 });
                const archBanner = new THREE.Mesh(archBannerGeo, archBannerMat);
                archBanner.position.set(0, 7, z);
                scene.add(archBanner);
            }
        }
        scene.add(buildingsGroup);

        // --- Player Vehicle ---
        function createPlayerCar() {
            const carGroup = new THREE.Group();

            const bodyGeo = new THREE.BoxGeometry(2.0, 0.8, 4.2);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.2, metalness: 0.6 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.7;
            body.castShadow = true;
            carGroup.add(body);

            const cabinGeo = new THREE.BoxGeometry(1.6, 0.6, 2.2);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.1 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 1.3, -0.2);
            cabin.castShadow = true;
            carGroup.add(cabin);

            const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
            wheelGeo.rotateZ(Math.PI / 2);

            const wPositions = [
                [-1.0, 0.4, 1.3], [1.0, 0.4, 1.3],
                [-1.0, 0.4, -1.3], [1.0, 0.4, -1.3]
            ];

            wPositions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.position.set(...pos);
                wheel.castShadow = true;
                carGroup.add(wheel);
            });

            return carGroup;
        }

        const car = createPlayerCar();
        scene.add(car);

        // --- Traffic & Obstacles ---
        const obstacles = [];
        const OBSTACLE_COUNT = 10;

        function createObstacle() {
            const obsGroup = new THREE.Group();
            const colors = [0xdc2626, 0x16a34a, 0xd97706, 0x4b5563, 0xfacc15];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];

            const bodyGeo = new THREE.BoxGeometry(1.9, 0.9, 3.8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: randomColor, roughness: 0.4 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.65;
            body.castShadow = true;
            obsGroup.add(body);

            return obsGroup;
        }

        function resetObstacle(obs, zPos) {
            const lanes = [-5.5, -1.8, 1.8, 5.5];
            obs.position.x = lanes[Math.floor(Math.random() * lanes.length)];
            obs.position.z = zPos || car.position.z - 200 - Math.random() * 100;
            obs.speed = 0.12 + Math.random() * 0.15;
        }

        for (let i = 0; i < OBSTACLE_COUNT; i++) {
            const obs = createObstacle();
            resetObstacle(obs, -60 - (i * 40));
            scene.add(obs);
            obstacles.push(obs);
        }

        // --- Adjustable Physics Variables ---
        let accel = 0.004;
        let maxSpeed = 1.4;
        let steerResponse = 0.003;
        let friction = 0.002;

        let speed = 0;
        let carHeading = 0;          
        let steeringAngle = 0;       
        const brakingPower = 0.01;   
        const maxSteer = 0.035;      
        const steerReturn = 0.08;    
        
        let score = 0;
        let gameOver = false;
        let isPaused = false;

        // Settings Menu Event Listeners
        const settingsMenu = document.getElementById('settings-menu');
        
        document.getElementById('accel-slider').addEventListener('input', (e) => {
            accel = parseFloat(e.target.value);
            document.getElementById('accel-disp').innerText = accel.toFixed(3);
        });
        document.getElementById('speed-slider').addEventListener('input', (e) => {
            maxSpeed = parseFloat(e.target.value);
            document.getElementById('speed-disp').innerText = Math.round(maxSpeed * 160);
        });
        document.getElementById('steer-slider').addEventListener('input', (e) => {
            steerResponse = parseFloat(e.target.value);
            document.getElementById('steer-disp').innerText = steerResponse.toFixed(4);
        });
        document.getElementById('frict-slider').addEventListener('input', (e) => {
            friction = parseFloat(e.target.value);
            document.getElementById('frict-disp').innerText = friction.toFixed(3);
        });

        function toggleSettings() {
            if (gameOver) return;
            isPaused = !isPaused;
            if (isPaused) {
                settingsMenu.classList.add('active');
            } else {
                settingsMenu.classList.remove('active');
            }
        }

        const keys = { KeyW: false, KeyS: false, KeyA: false, KeyD: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, Space: false };

        window.addEventListener('keydown', (e) => { 
            if (e.code === 'Escape') {
                toggleSettings();
                return;
            }
            if (keys.hasOwnProperty(e.code)) keys[e.code] = true; 
        });

        window.addEventListener('keyup', (e) => { 
            if (keys.hasOwnProperty(e.code)) keys[e.code] = false; 
        });

        function updatePhysics() {
            if (gameOver || isPaused) return;

            // 1. Acceleration & Braking
            const forward = keys.KeyW || keys.ArrowUp;
            const backward = keys.KeyS || keys.ArrowDown;
            const handbrake = keys.Space;

            if (forward) {
                speed = Math.min(speed + accel, maxSpeed);
            } else if (backward) {
                speed = Math.max(speed - brakingPower, -maxSpeed * 0.3);
            } else {
                if (speed > 0) speed = Math.max(0, speed - friction);
                if (speed < 0) speed = Math.min(0, speed + friction);
            }

            if (handbrake) {
                speed *= 0.95;
            }

            // 2. Steering Physics
            const left = keys.KeyA || keys.ArrowLeft;
            const right = keys.KeyD || keys.ArrowRight;

            if (left) {
                steeringAngle = Math.min(steeringAngle + steerResponse, maxSteer);
            } else if (right) {
                steeringAngle = Math.max(steeringAngle - steerResponse, -maxSteer);
            } else {
                steeringAngle += (0 - steeringAngle) * steerReturn;
            }

            if (Math.abs(speed) > 0.01) {
                const dir = speed >= 0 ? 1 : -1;
                carHeading += steeringAngle * (speed / maxSpeed) * dir;
            }

            car.position.z -= Math.cos(carHeading) * speed;
            car.position.x -= Math.sin(carHeading) * speed * 1.8;

            car.rotation.y = carHeading;
            car.rotation.z = steeringAngle * (speed / maxSpeed) * 0.4;

            const maxBound = (ROAD_WIDTH / 2) - 1.5;
            if (car.position.x < -maxBound) {
                car.position.x = -maxBound;
                speed *= 0.85;
            }
            if (car.position.x > maxBound) {
                car.position.x = maxBound;
                speed *= 0.85;
            }

            road.position.z = car.position.z - (ROAD_LENGTH / 4);
            leftPave.position.z = road.position.z;
            rightPave.position.z = road.position.z;
            roadMaterial.map.offset.y = -car.position.z * 0.04;

            camera.position.x = car.position.x * 0.7;
            camera.position.y = car.position.y + 3.8;
            camera.position.z = car.position.z + 8.5;
            camera.lookAt(car.position.x, car.position.y + 1.0, car.position.z - 12);

            const playerBox = new THREE.Box3().setFromObject(car);

            obstacles.forEach(obs => {
                obs.position.z += obs.speed;

                if (obs.position.z > camera.position.z + 10) {
                    resetObstacle(obs, car.position.z - 260);
                }

                const obsBox = new THREE.Box3().setFromObject(obs);
                if (playerBox.intersectsBox(obsBox)) {
                    triggerGameOver();
                }
            });

            if (speed > 0.1) {
                score += Math.round(speed * 10);
                document.getElementById('score-val').innerText = score;
            }

            document.getElementById('speed-val').innerText = Math.round(Math.abs(speed) * 160);
        }

        function triggerGameOver() {
            gameOver = true;
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over').classList.add('active');
        }

        function resetGame() {
            gameOver = false;
            isPaused = false;
            speed = 0;
            carHeading = 0;
            steeringAngle = 0;
            score = 0;
            car.position.set(0, 0, 0);
            car.rotation.set(0, 0, 0);

            obstacles.forEach((obs, idx) => {
                resetObstacle(obs, -60 - (idx * 40));
            });

            document.getElementById('score-val').innerText = '0';
            document.getElementById('game-over').classList.remove('active');
            settingsMenu.classList.remove('active');
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
