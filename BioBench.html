<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="BioBench — an all-in-one biology calculator for dilution, molarity, osmolarity, cell culture, plating, centrifugation, and lab prep." />
  <title>BioBench — Biology Lab Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #f5f7f9;
  --panel: #ffffff;
  --panel-2: #f8fafc;
  --text: #0e1726;
  --muted: #6b778c;
  --border: #dde3eb;
  --border-strong: #c6d0dc;
  --primary: #0f766e;
  --primary-2: #0c5f59;
  --accent: #84cc16;
  --danger: #b42318;
  --shadow: 0 14px 34px rgba(14, 23, 38, .08);
  --sidebar: #0b1220;
  --sidebar-muted: #91a0b5;
  --sidebar-active: rgba(255,255,255,.10);
  --sidebar-border: rgba(255,255,255,.08);
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; font-family: 'DM Sans', system-ui, sans-serif; background: var(--bg); color: var(--text); }
button, input, select { font: inherit; }
button { cursor: pointer; }

.app-shell { min-height: 100vh; display: grid; grid-template-columns: 272px 1fr; }
.sidebar { position: sticky; top: 0; height: 100vh; background: var(--sidebar); color: #fff; display: flex; flex-direction: column; padding: 18px 14px; overflow: hidden; z-index: 20; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.brand-mark { width: 39px; height: 39px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 15px; background: linear-gradient(145deg, #14b8a6, #84cc16); color: #07120f; box-shadow: 0 10px 22px rgba(20,184,166,.25); }
.brand-mark span { font-weight: 600; opacity: .8; }
.brand-name { font-weight: 800; letter-spacing: -.03em; }
.brand-sub { font-size: 10px; color: var(--sidebar-muted); margin-top: 2px; }
.sidebar-search { position: relative; margin: 0 4px 14px; }
.sidebar-search input { width: 100%; border: 1px solid var(--sidebar-border); background: rgba(255,255,255,.06); color: #fff; outline: none; border-radius: 10px; padding: 10px 54px 10px 12px; font-size: 13px; }
.sidebar-search input::placeholder { color: #8190a4; }
.sidebar-search span { position: absolute; right: 9px; top: 8px; font: 11px var(--mono); color: #738095; padding: 2px 5px; border: 1px solid var(--sidebar-border); border-radius: 5px; }
.nav { overflow-y: auto; padding-right: 2px; }
.nav::-webkit-scrollbar { width: 5px; }
.nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 999px; }
.nav-label { padding: 11px 9px 6px; font-size: 9px; letter-spacing: .14em; color: #64748b; font-weight: 700; }
.nav-label-space { margin-top: 7px; }
.nav-item { display: flex; align-items: center; gap: 11px; width: 100%; border: 0; background: transparent; color: #aeb8c7; text-align: left; padding: 8px 10px; border-radius: 9px; font-size: 12.5px; margin: 2px 0; transition: .15s ease; }
.nav-item span:first-child { width: 17px; text-align: center; color: #79889f; font-size: 14px; }
.nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav-item.active { background: var(--sidebar-active); color: #fff; box-shadow: inset 2px 0 0 #14b8a6; }
.nav-item.active span:first-child { color: #5eead4; }
.sidebar-footer { margin-top: auto; padding: 11px 6px 0; }
.safety-note { font-size: 10px; line-height: 1.45; color: #7d8ba0; padding: 10px; border: 1px solid var(--sidebar-border); background: rgba(255,255,255,.025); border-radius: 9px; }
.safety-note strong { color: #b8c3d1; }
.footer-row { display: flex; align-items: center; justify-content: space-between; font-size: 9px; color: #627086; padding: 8px 4px 0; }
.footer-row button { border: 0; background: transparent; color: #8290a5; }

.main { min-width: 0; }
.topbar { height: 63px; background: rgba(245,247,249,.9); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 28px; position: sticky; top: 0; z-index: 12; }
.crumbs { display: flex; gap: 9px; align-items: center; font-size: 12px; color: var(--muted); }
.crumbs strong { color: var(--text); }
.top-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn, .history-btn { border: 1px solid var(--border); background: #fff; color: #4c5a6b; border-radius: 8px; height: 34px; padding: 0 11px; font-size: 12px; }
.icon-btn { width: 34px; padding: 0; font-size: 17px; }
.history-btn span { font: 10px var(--mono); background: #eef2f6; padding: 3px 6px; border-radius: 999px; margin-left: 4px; }
.mobile-menu { display: none; border: 0; background: transparent; color: var(--text); font-size: 21px; margin-right: 8px; }

.content { max-width: 1320px; margin: 0 auto; padding: 30px 34px 54px; }
.hero { display: grid; grid-template-columns: 1.5fr .8fr; gap: 18px; margin-bottom: 20px; }
.hero-main, .hero-side { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); }
.hero-main { padding: 25px; position: relative; overflow: hidden; }
.hero-main:after { content: ''; position: absolute; width: 240px; height: 240px; border-radius: 50%; right: -90px; top: -110px; background: radial-gradient(circle, rgba(20,184,166,.12), transparent 65%); pointer-events: none; }
.kicker { font-size: 10px; text-transform: uppercase; letter-spacing: .13em; color: var(--primary); font-weight: 800; }
h1 { margin: 7px 0 9px; font-size: 31px; letter-spacing: -.04em; line-height: 1.05; }
.hero-main p { color: var(--muted); font-size: 13px; max-width: 670px; line-height: 1.6; margin: 0; }
.hero-side { padding: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { border: 1px solid var(--border); background: var(--panel-2); border-radius: 12px; padding: 13px; }
.stat .num { font: 700 21px var(--mono); letter-spacing: -.04em; }
.stat .lab { font-size: 10px; color: var(--muted); margin-top: 5px; }

.section-head { display: flex; align-items: end; justify-content: space-between; margin: 24px 0 10px; }
.section-head h2 { font-size: 14px; margin: 0; letter-spacing: -.02em; }
.section-head p { margin: 0; font-size: 10px; color: var(--muted); }
.tool-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; }
.tool-card { border: 1px solid var(--border); background: var(--panel); padding: 15px; border-radius: 12px; text-align: left; transition: .15s ease; min-height: 124px; }
.tool-card:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(14,23,38,.07); border-color: #cbd5df; }
.tool-card .glyph { font-size: 20px; color: var(--primary); }
.tool-card h3 { margin: 9px 0 3px; font-size: 12.5px; }
.tool-card p { margin: 0; color: var(--muted); font-size: 10.5px; line-height: 1.45; }

.notice { padding: 11px 13px; background: #f0fdfa; color: #155e59; border: 1px solid #bae6e1; border-radius: 10px; font-size: 11px; line-height: 1.5; margin-bottom: 14px; }
.calc-layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(280px, .7fr); gap: 15px; align-items: start; }
.calc-card, .result-card, .reference-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 6px 18px rgba(14,23,38,.035); }
.calc-card { padding: 18px; }
.result-card { padding: 18px; position: sticky; top: 83px; }
.tool-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; margin-bottom: 16px; }
.tool-title h1 { font-size: 21px; margin: 0 0 4px; }
.tool-title p { font-size: 11px; color: var(--muted); margin: 0; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 13px; }
.form-grid.three { grid-template-columns: repeat(3, minmax(0,1fr)); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 10.5px; font-weight: 700; color: #405065; }
.field label span { font-weight: 400; color: #8a96a7; }
.field input, .field select, textarea { border: 1px solid var(--border); background: #fff; color: var(--text); padding: 10px 11px; border-radius: 8px; outline: none; font-size: 12px; transition: .12s ease; }
.field input:focus, .field select:focus, textarea:focus { border-color: #85c7c1; box-shadow: 0 0 0 3px rgba(20,184,166,.09); }
.unit-wrap { display: grid; grid-template-columns: 1fr 74px; gap: 7px; }
.unit-wrap input { min-width: 0; }
.actions { display: flex; gap: 8px; margin-top: 16px; }
.primary-btn, .secondary-btn { border: 0; border-radius: 8px; padding: 9px 13px; font-size: 11px; font-weight: 700; }
.primary-btn { background: var(--primary); color: #fff; box-shadow: 0 6px 12px rgba(15,118,110,.18); }
.primary-btn:hover { background: var(--primary-2); }
.secondary-btn { border: 1px solid var(--border); background: #fff; color: #4d5a6d; }
.full { grid-column: 1 / -1; }
.field-help { color: #8a96a7; font-size: 9px; margin-top: 1px; }
.divider { border: 0; border-top: 1px solid var(--border); margin: 17px 0; }

.result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
.result-header h3 { margin: 0; font-size: 12px; }
.copy-btn { border: 1px solid var(--border); background: #fff; border-radius: 7px; font-size: 10px; padding: 6px 8px; color: #637184; }
.result-main { font: 700 27px var(--mono); letter-spacing: -.04em; line-height: 1.25; word-break: break-word; }
.result-unit { color: var(--muted); font-size: 10.5px; margin-top: 2px; }
.result-steps { margin-top: 15px; padding-top: 13px; border-top: 1px solid var(--border); }
.result-steps .step-label { font-size: 9px; color: #8792a3; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; }
.result-steps pre { white-space: pre-wrap; margin: 7px 0 0; font: 11px/1.55 var(--mono); color: #445165; background: #f7f9fb; padding: 10px; border-radius: 8px; }
.result-note { font-size: 9.5px; line-height: 1.5; color: var(--muted); margin-top: 12px; }
.result-table { width: 100%; border-collapse: collapse; font-size: 10.5px; margin-top: 10px; }
.result-table th, .result-table td { padding: 7px 4px; border-bottom: 1px solid var(--border); text-align: left; }
.result-table th { color: var(--muted); font-weight: 600; }

.dynamic-row { display: grid; grid-template-columns: 1.1fr .65fr .65fr .45fr auto; gap: 7px; margin-bottom: 8px; align-items: end; }
.row-head { font-size: 9px; color: #8995a6; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 6px; }
.tiny-btn { width: 30px; height: 34px; border: 1px solid var(--border); background: #fff; border-radius: 7px; color: #8792a3; }
.add-row { margin-top: 2px; border: 1px dashed var(--border-strong); background: transparent; color: var(--primary); border-radius: 8px; font-size: 10px; padding: 7px 9px; font-weight: 700; }

.ref-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; }
.ref-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--panel); }
.ref-card h4 { margin: 0 0 7px; font-size: 11px; }
.ref-card p { margin: 0; font: 10px/1.55 var(--mono); color: #556274; }

.modal-backdrop { position: fixed; inset: 0; background: rgba(8,15,27,.42); display: grid; place-items: center; z-index: 100; padding: 20px; }
.modal-backdrop[hidden] { display: none; }
.modal { width: min(610px, 100%); max-height: 75vh; display: flex; flex-direction: column; background: #fff; border-radius: 15px; border: 1px solid var(--border); box-shadow: 0 30px 60px rgba(0,0,0,.17); }
.modal-head { padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
.modal-head h3 { margin: 0; font-size: 13px; }
.close-btn { border: 0; background: transparent; font-size: 22px; color: #8a95a4; }
.history-list { overflow-y: auto; padding: 7px 15px; }
.history-item { border-bottom: 1px solid var(--border); padding: 11px 2px; }
.history-item:last-child { border-bottom: 0; }
.history-item .h-title { font-weight: 700; font-size: 11px; }
.history-item .h-meta { font-size: 9px; color: var(--muted); margin-top: 2px; }
.history-item .h-value { font: 600 11px var(--mono); margin-top: 6px; }
.modal-foot { border-top: 1px solid var(--border); padding: 11px 15px; }
.toast { position: fixed; right: 20px; bottom: 20px; background: #0f172a; color: #fff; padding: 10px 13px; border-radius: 8px; font-size: 11px; opacity: 0; transform: translateY(10px); pointer-events: none; transition: .2s ease; z-index: 120; }
.toast.show { opacity: 1; transform: none; }

.empty-state { padding: 25px; border: 1px dashed var(--border-strong); border-radius: 12px; text-align: center; color: var(--muted); font-size: 12px; }
.badge { display: inline-flex; gap: 5px; align-items: center; font-size: 9px; padding: 4px 7px; border-radius: 999px; background: #ecfeff; color: #155e75; border: 1px solid #bae6fd; font-weight: 700; }

.dark { --bg:#0a0f18; --panel:#101827; --panel-2:#0c1420; --text:#e8eef8; --muted:#99a7ba; --border:#243144; --border-strong:#344258; --primary:#2dd4bf; --primary-2:#14b8a6; --shadow:0 16px 40px rgba(0,0,0,.24); }
.dark .topbar { background: rgba(10,15,24,.88); }
.dark .calc-card, .dark .result-card, .dark .reference-card, .dark .hero-main, .dark .hero-side, .dark .tool-card, .dark .ref-card, .dark .modal, .dark .icon-btn, .dark .history-btn, .dark .copy-btn, .dark .secondary-btn { background: var(--panel); color: var(--text); }
.dark .field input, .dark .field select, .dark textarea { background: #0c1420; color: var(--text); border-color: var(--border); }
.dark .result-steps pre { background: #0b1420; color: #b8c5d6; }
.dark .history-btn span { background: #1a2433; }
.dark .notice { background: #0c2220; border-color: #164e4a; color: #9ee9df; }

@media (max-width: 1050px) {
  .app-shell { grid-template-columns: 224px 1fr; }
  .hero { grid-template-columns: 1fr; }
  .tool-grid { grid-template-columns: repeat(2, 1fr); }
  .ref-grid { grid-template-columns: repeat(2,1fr); }
}
@media (max-width: 780px) {
  .app-shell { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: -280px; width: 270px; transition: .2s ease; }
  .sidebar.open { left: 0; box-shadow: 16px 0 50px rgba(0,0,0,.25); }
  .mobile-menu { display: inline-block; }
  .topbar { padding: 0 14px; }
  .content { padding: 20px 14px 40px; }
  .calc-layout { grid-template-columns: 1fr; }
  .result-card { position: static; }
  .form-grid, .form-grid.three { grid-template-columns: 1fr; }
  .dynamic-row { grid-template-columns: 1fr 1fr; }
  .dynamic-row .remove-dynamic { grid-column: 2; justify-self: end; }
}
@media (max-width: 500px) {
  .tool-grid, .ref-grid { grid-template-columns: 1fr; }
  h1 { font-size: 26px; }
  .hero-side { grid-template-columns: 1fr 1fr; }
  .top-actions .icon-btn { display: none; }
}

  
.plate-studio{display:grid;grid-template-columns:290px 1fr;gap:16px}.plate-controls{display:grid;gap:10px}.plate-grid-wrap{overflow:auto;border:1px solid var(--border);border-radius:12px;background:var(--panel-2);padding:14px}.plate-grid{display:grid;gap:5px;align-items:center;min-width:620px}.well{width:31px;height:31px;border:1px solid var(--border-strong);border-radius:50%;background:#fff;font:10px var(--mono);color:var(--muted);display:grid;place-items:center;padding:0}.well.selected{outline:2px solid var(--primary);outline-offset:1px}.well.assigned{background:var(--well-color,#dff7f2);border-color:var(--primary);color:var(--text)}.well-label{font:11px var(--mono);color:var(--muted);text-align:center}.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.legend button{border:1px solid var(--border);background:var(--panel);border-radius:999px;padding:6px 9px;font-size:12px}.legend button.active{border-color:var(--primary);background:var(--viz-accent-bg,#e8f5f3)}.plan-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini-stat{border:1px solid var(--border);border-radius:9px;padding:10px;background:var(--panel-2)}.mini-stat b{display:block;font-size:18px}.mini-stat span{font-size:11px;color:var(--muted)}.print-only{display:none}.assignment-list{max-height:180px;overflow:auto;border:1px solid var(--border);border-radius:9px;padding:8px}.assignment-row{display:flex;justify-content:space-between;gap:8px;padding:6px 2px;font-size:12px}.vial-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}.vial{border:1px solid var(--border);border-radius:10px;padding:9px;background:var(--panel);text-align:center;cursor:pointer}.vial.selected{outline:2px solid var(--primary)}
@media(max-width:900px){.plate-studio{grid-template-columns:1fr}.plan-summary{grid-template-columns:1fr 1fr}}
@media print{body *{visibility:hidden!important}.print-area,.print-area *{visibility:visible!important}.print-area{position:absolute;left:0;top:0;width:100%;padding:20px}.no-print{display:none!important}.print-only{display:block!important}.plate-grid-wrap{border:0}.well{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">B<span>io</span></div>
        <div>
          <div class="brand-name">BioBench</div>
          <div class="brand-sub">biology • calculations • lab prep</div>
        </div>
      </div>

      <div class="sidebar-search">
        <input id="navSearch" type="search" placeholder="Find a calculator…" autocomplete="off" />
        <span>⌘K</span>
      </div>

      <nav class="nav" id="navList">
        <div class="nav-label">WORKBENCH</div>
        <button class="nav-item active" data-tool="home"><span>⌂</span> Dashboard</button>

        <button class="nav-item" data-tool="molarity"><span>◈</span> Molarity & MW</button>

        <button class="nav-item" data-tool="percent"><span>%</span> % Solutions</button>
        <button class="nav-item" data-tool="cells"><span>◉</span> Cell Concentration</button>
        <button class="nav-item" data-tool="hemocytometer"><span>▦</span> Hemocytometer</button>
        <button class="nav-item" data-tool="seeding"><span>♙</span> Cell Seeding</button>
        <button class="nav-item" data-tool="split"><span>↗</span> Cell Splitting</button>
        <button class="nav-item" data-tool="mastermix"><span>✣</span> Master Mix</button>

        <button class="nav-item" data-tool="centrifuge"><span>⟳</span> Centrifuge (RCF/RPM)</button>

        <div class="nav-label nav-label-space">REFERENCES</div>

      </div>
    </aside>

    <main class="main" id="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button>
        <div class="crumbs"><span>BioBench</span><span>/</span><strong id="pageCrumb">Dashboard</strong></div>

          <button class="icon-btn" id="clearAll" title="Reset current calculator">↺</button>
          <button class="history-btn" id="historyBtn">History <span id="historyCount">0</span></button>

      <section class="content" id="content"></section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-backdrop" id="historyModal" hidden>
    <div class="modal">
      <div class="modal-head"><h3>Recent calculations</h3><button class="close-btn" id="closeHistory">×</button></div>
      <div id="historyList" class="history-list"></div>
      <div class="modal-foot"><button class="secondary-btn" id="clearHistory">Clear history</button></div>
    </div>

  <script>
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];

const toolMeta = {
  dilution: {title:'Dilution', desc:'Use C₁V₁ = C₂V₂ for stocks, reagents, antibodies, dyes, and media additives.', icon:'⇄'},

function fmt(x, sig=5) {
  if (!Number.isFinite(x)) return '—';
  if (x === 0) return '0';
  const abs = Math.abs(x);
  if (abs >= 1000000 || abs < 0.0001) return x.toExponential(3);
  return Number(x.toPrecision(sig)).toLocaleString(undefined, {maximumSignificantDigits:sig});
}
function num(v) { return parseFloat(v); }
function val(id, root=document) { return num($(id, root)?.value); }
function input(id, value, root=document) { const e=$(id, root); if(e)e.value=value; }
function need(...xs) { return xs.every(x=>Number.isFinite(x)); }
function showToast(msg) {
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._t); showToast._t=setTimeout(()=>t.classList.remove('show'), 1800);
}
function saveHistory(tool, result, detail='') {
  recent.unshift({tool, result, detail, time:new Date().toLocaleString()});
  recent.splice(30);
  localStorage.setItem('biobenchHistory', JSON.stringify(recent));
  $('#historyCount').textContent=recent.length;
}

}
function emptyResult() {
  return `<div class="result-header"><h3>Result</h3></div><div class="empty-state">Enter values and calculate.<br/>Your result and working equation will appear here.</div>`;

function resultBox(main, unit, steps, note='') {
  return `<div class="result-header"><h3>Result</h3><button class="copy-btn" data-copy="${escapeAttr((main+' '+unit).trim())}">Copy</button></div><div class="result-main">${main}</div><div class="result-unit">${unit}</div>${steps?`<div class="result-steps"><div class="step-label">Calculation</div><pre>${steps}</pre></div>`:''}${note?`<div class="result-note">${note}</div>`:''}`;
}
function resultTable(headers, rows) {

function escapeAttr(s){ return String(s).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }

function calcDilution(){
  let c1=val('#d-c1'), v1=val('#d-v1'), c2=val('#d-c2'), v2=val('#d-v2');
  const u1=$('#d-c1u').value,u2=$('#d-c2u').value,vu1=$('#d-v1u').value,vu2=$('#d-v2u').value;
  function cToM(x,u){return u==='M'?x:u==='mM'?x/1000:u==='µM'?x/1e6:x;}
  const ratio=val('#d-ratio');
  if(!need(c1) && need(c2) && ratio) c1=c2*ratio;
  if(!need(c2) && need(c1) && ratio) c2=c1/ratio;
  const provided=[Number.isFinite(c1),Number.isFinite(v1),Number.isFinite(c2),Number.isFinite(v2)].filter(Boolean).length;
  if(provided<3){return setResult(resultBox('Enter 3 values','', 'C₁V₁ = C₂V₂\nAny three quantities are required.'),'Dilution','Incomplete input');}
  const a=cToM(c1,u1), b=cToM(c2,u2);
  let answer='',steps='C₁ × V₁ = C₂ × V₂\n';
  if(!Number.isFinite(v1)) { v1=b*v2/a; answer=fmt(v1)+' '+vu2; steps+=`V₁ = (${fmt(c2)} × ${fmt(v2)}) / ${fmt(c1)} = ${fmt(v1)}`; }
  else if(!Number.isFinite(v2)) { v2=a*v1/b; answer=fmt(v2)+' '+vu1; steps+=`V₂ = (${fmt(c1)} × ${fmt(v1)}) / ${fmt(c2)} = ${fmt(v2)}`; }
  else if(!Number.isFinite(c1)) { c1=b*v2/v1; answer=fmt(c1)+' '+u2; steps+=`C₁ = (${fmt(c2)} × ${fmt(v2)}) / ${fmt(v1)} = ${fmt(c1)}`; }
  else if(!Number.isFinite(c2)) { c2=a*v1/v2; answer=fmt(c2)+' '+u1; steps+=`C₂ = (${fmt(c1)} × ${fmt(v1)}) / ${fmt(v2)} = ${fmt(c2)}`; }
  else { answer=fmt((a*v1)/(v2||1))+' '+u1; steps+=`Entered values are internally consistent.\nFinal mix volume = ${fmt(v2)} ${vu2}`; }
  setResult(resultBox(answer,'',steps,'Concentrations are converted only when their units are molar. For mass/volume units, keep the same concentration basis on both sides.'),'Dilution',steps);
}

function calcMolarity(){
  const mass=val('#m-mass'), mw=val('#m-mw'), vol=val('#m-vol'), mol=val('#m-molar');
  const mu=$('#m-mass-u').value,vu=$('#m-vol-u').value,molu=$('#m-molar-u').value;
  const mg={g:1,mg:1e-3,'µg':1e-6}[mu], vl={L:1,mL:1e-3,'µL':1e-6}[vu], mf={M:1,mM:1e-3,µM:1e-6,nM:1e-9}[molu];
  const mode=$('#m-mode').value;
  if(mode==='mass' && need(mol,mw,vol)){ const g=mol*mf*vl*mw; setResult(resultBox(fmt(g*1000)+' mg','required mass',`mass = M × V × MW\n= ${fmt(mol*mf)} × ${fmt(vl)} × ${fmt(mw)}\n= ${fmt(g)} g`),'Molarity','Mass from M, MW, V'); return; }
  if(mode==='molar' && need(mass,mw,vol)){ const M=(mass*mg)/(vl*mw); setResult(resultBox(fmt(M*1000)+' mM','molarity',`M = mass / (MW × V)\n= ${fmt(mass*mg)} / (${fmt(mw)} × ${fmt(vl)})\n= ${fmt(M)} M`),'Molarity','M from mass, MW, V'); return; }
  if(need(mass,mw,vol) && !need(mol)){ const M=(mass*mg)/(mw*vl); setResult(resultBox(fmt(M*1000)+' mM','molarity',`M = mass / (MW × V)\n= ${fmt(M)} M`),'Molarity','Auto'); return; }
  if(need(mol,mw,vol) && !need(mass)){ const g=mol*mf*vl*mw; setResult(resultBox(fmt(g*1000)+' mg','mass',`mass = M × V × MW\n= ${fmt(g)} g`),'Molarity','Auto'); return; }
  setResult(resultBox('Enter enough values','', 'Use at least mass + MW + volume, or M + MW + volume.'),'Molarity','Incomplete input');
}

function calcOsm(){
  const rows=$$('.dynamic-row', $('#osmRows')); let totalm=0; const details=[];
  for(const r of rows){ const c=num($('.osm-conc',r)?.value), i=num($('.osm-i',r)?.value); if(need(c,i)){ totalm += c*i; details.push(`${$('.osm-name',r)?.value||'solute'}: ${fmt(c)} mM × ${fmt(i)} = ${fmt(c*i)} mOsm/L`); }}
  if(!details.length) return setResult(resultBox('Enter solutes','', 'Add concentration and particle-count values.'),'Osmolarity','Incomplete');
  setResult(resultBox(fmt(totalm)+' mOsm/L','estimated osmolarity',details.join('\n')+`\n\nTotal = ${fmt(totalm)} mOsm/L`,'For real buffers/media, temperature, activity coefficients, incomplete dissociation, and protocol-specific assumptions can make measured osmolarity differ from the simple ideal calculation.'),'Osmolarity',details.join('; '));
}

function calcPercent(){
  const type=$('#p-type').value; const pct=val('#p-pct'), final=val('#p-final'), finalU=$('#p-final-u').value, stock=val('#p-stock'), mode=$('#p-mode').value;
  if(!need(pct,final)) return setResult(resultBox('Enter target % and final amount','', 'Example: 2% w/v, final volume 500 mL.'),'% Solutions','Incomplete');
  if(mode==='direct'){
    if(type==='wv' && finalU==='mL'){ const g=pct*final/100; return setResult(resultBox(fmt(g)+' g','solute required',`mass = (% × volume) / 100\n= (${fmt(pct)} × ${fmt(final)}) / 100 = ${fmt(g)} g`),'% Solutions','Direct w/v'); }
    if(type==='vv' && finalU==='mL'){ const ml=pct*final/100; return setResult(resultBox(fmt(ml)+' mL','liquid solute required',`volume = (% × final volume) / 100\n= ${fmt(ml)} mL`),'% Solutions','Direct v/v'); }
    if(type==='ww' && finalU==='g'){ const g=pct*final/100; return setResult(resultBox(fmt(g)+' g','solute required',`mass = (% × final mass) / 100\n= ${fmt(g)} g`),'% Solutions','Direct w/w'); }
    return setResult(resultBox('Check units','', 'w/v and v/v use final mL; w/w uses final g.'),'% Solutions','Unit mismatch');
  }
  if(mode==='stock' && need(stock)){ const ratio=stock/pct; const stockAmt=final/ratio; const diluent=final-stockAmt; return setResult(resultBox(fmt(stockAmt)+' '+finalU,'stock volume required',`V₁ = C₂V₂/C₁\n= (${fmt(pct)} × ${fmt(final)}) / ${fmt(stock)}\n= ${fmt(stockAmt)} ${finalU}\nAdd diluent to ${fmt(final)} ${finalU} total.\nDiluent ≈ ${fmt(diluent)} ${finalU}`),'% Solutions','Stock dilution'); }
  setResult(resultBox('Enter stock %','', 'For stock mode, specify the stock concentration on the same % basis.'),'% Solutions','Incomplete');
}

function calcCells(){
  const total=val('#c-total'), vol=val('#c-vol'), conc=val('#c-conc'), via=val('#c-via');
  if(Number.isFinite(total)&&Number.isFinite(vol)&&!Number.isFinite(conc)){ const c=total/vol; return setResult(resultBox(fmt(c)+' cells/mL','concentration',`cells/mL = total cells / volume\n= ${fmt(total)} / ${fmt(vol)} = ${fmt(c)}`),'Cell Concentration','Auto'); }
  if(Number.isFinite(conc)&&Number.isFinite(vol)&&!Number.isFinite(total)){ const t=conc*vol; return setResult(resultBox(fmt(t)+' cells','total cells',`total cells = concentration × volume\n= ${fmt(conc)} × ${fmt(vol)} = ${fmt(t)}`),'Cell Concentration','Auto'); }
  if(Number.isFinite(total)&&Number.isFinite(conc)&&!Number.isFinite(vol)){ const v=total/conc; return setResult(resultBox(fmt(v)+' mL','volume',`volume = total cells / concentration\n= ${fmt(total)} / ${fmt(conc)} = ${fmt(v)} mL`),'Cell Concentration','Auto'); }
  if(Number.isFinite(via)&&Number.isFinite(total)){ const live=total*via/100; const dead=total-live; return setResult(resultBox(fmt(live)+' live cells','viable cell count',`live = total × viability / 100\n= ${fmt(total)} × ${fmt(via)}/100 = ${fmt(live)}\nNon-viable ≈ ${fmt(dead)}`),'Cell Concentration','Viability'); }
  setResult(resultBox('Enter two or more linked values','', 'Use total cells + volume, concentration + volume, or total cells + viability.'),'Cell Concentration','Incomplete');
}

function calcHem(){
  const ns=['h1','h2','h3','h4'].map(id=>val('#'+id)).filter(Number.isFinite), df=val('#hdil'), factor=val('#hfactor');
  if(!ns.length || !need(df,factor)) return setResult(resultBox('Enter chamber counts','', 'At least one counted square is required.'),'Hemocytometer','Incomplete');
  const avg=ns.reduce((a,b)=>a+b,0)/ns.length, conc=avg*df*factor;
  let steps=`Average count = (${ns.join(' + ')}) / ${ns.length} = ${fmt(avg)}\ncells/mL = average × dilution factor × chamber factor\n= ${fmt(avg)} × ${fmt(df)} × ${fmt(factor)}\n= ${fmt(conc)} cells/mL`;
  let note='';
  if($('#hviable').value==='yes'){
    const va=val('#hvavg'), ta=val('#htavg'); if(need(va,ta) && ta>0){ const vio=100*va/ta; steps+=`\nViability = viable average / total average × 100\n= ${fmt(vio)}%`; note=`Estimated viable concentration ≈ ${fmt(conc*vio/100)} cells/mL.`; }
  }
  setResult(resultBox(fmt(conc)+' cells/mL','cell concentration',steps,note),'Hemocytometer',steps);
}

function calcSeed(){
  const vessel=$('#s-vessel').value, cpw=val('#s-cpw'), wells=val('#s-wells'), extra=val('#s-extra')||0, conc=val('#s-conc'), vol=val('#s-vol'), over=val('#s-over')||0;
  if(!need(cpw,wells,conc,vol)) return setResult(resultBox('Enter all core values','', `Need target cells/${vessel}, vessel count, suspension concentration, and final volume/${vessel}.`),'Cell Seeding','Incomplete');
  const totalVessels=wells+extra, cells=cpw*totalVessels, baseVol=cells/conc, finalSuspVol=baseVol*(1+over/100);
  const mediumVol=Math.max(0, vol*totalVessels-finalSuspVol);
  const perVesselSusp=cpw/conc;
  setResult(resultBox(fmt(finalSuspVol)+' mL','cell suspension to prepare',`Total ${vessel}s = ${fmt(wells)} + ${fmt(extra)} extra = ${fmt(totalVessels)}\nCells needed = ${fmt(cpw)} × ${fmt(totalVessels)} = ${fmt(cells)} cells\nBase suspension = ${fmt(cells)} / ${fmt(conc)} = ${fmt(baseVol)} mL\nWith ${fmt(over)}% overage = ${fmt(finalSuspVol)} mL\nPer ${vessel}: ${fmt(perVesselSusp*1000)} µL suspension + ${fmt(Math.max(0,vol-perVesselSusp)*1000)} µL medium\nTotal medium required ≈ ${fmt(mediumVol)} mL`,'Confirm the real pipetting mix and culture volume against the vessel manufacturer’s working range and your protocol.'), 'Cell Seeding', `${fmt(totalVessels)} ${vessel}s; ${fmt(cells)} cells`);
}

function calcSplit(){
  const c=val('#sp-conc'), hv=val('#sp-vol'), target=val('#sp-target'), fv=val('#sp-final'), ratio=val('#sp-ratio');
  if(ratio && Number.isFinite(c) && Number.isFinite(hv) && Number.isFinite(fv)){
    const seedVol=fv/ratio;
    return setResult(resultBox(fmt(seedVol)+' mL','harvest to transfer',`Split ratio 1:${ratio}\nTransfer = final volume / ratio\n= ${fmt(fv)} / ${fmt(ratio)} = ${fmt(seedVol)} mL\nAdd fresh medium to ${fmt(fv)} mL total.`),'Cell Splitting','Ratio mode');
  }
  if(need(c,hv,target,fv)){
    const total=c*hv, seedVol=(target*fv)/c, dilution=Math.max(0,fv-seedVol);
    const splitRatio=fv/seedVol;
    return setResult(resultBox(fmt(seedVol)+' mL','harvest volume to seed',`Total harvested cells = ${fmt(c)} × ${fmt(hv)} = ${fmt(total)}\nTransfer volume = (target × final volume) / harvest concentration\n= (${fmt(target)} × ${fmt(fv)}) / ${fmt(c)}\n= ${fmt(seedVol)} mL\nAdd medium = ${fmt(dilution)} mL\nApproximate split = 1:${fmt(splitRatio)}`),'Cell Splitting','Concentration mode');
  }
  setResult(resultBox('Enter a split plan','', 'Use either split ratio + harvest volume + final volume, or concentration + target density + final volume.'),'Cell Splitting','Incomplete');
}

function calcMM(){
  const n=val('#mm-n'), over=val('#mm-over')||0; const rows=$$('.mm-row', $('#mmRows')); if(!need(n)||n<=0)return setResult(resultBox('Enter reaction count','', 'Example: 24 reactions + 10% overage.'),'Master Mix','Incomplete');
  const factor=n*(1+over/100); const usable=[]; let totalPer=0;
  rows.forEach(r=>{ const name=$('.mm-name',r)?.value||'Component', v=num($('.mm-vol',r)?.value); if(Number.isFinite(v)){usable.push([name,fmt(v)+' µL',fmt(v*factor)+' µL',$('.mm-note',r)?.value||'']); totalPer+=v; }});
  if(!usable.length)return setResult(resultBox('Add components','', 'Enter at least one component volume per reaction.'),'Master Mix','Incomplete');

  $('#clearHistory').addEventListener('click',()=>{recent.length=0;localStorage.setItem('biobenchHistory','[]');$('#historyCount').textContent='0';openHistory();});
  $('#mobileMenu').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
  $('#navSearch').addEventListener('input', e=>{const q=e.target.value.toLowerCase().trim(); $$('.nav-item').forEach(b=>{const label=b.textContent.toLowerCase(); b.style.display=(!q||label.includes(q)||b.dataset.tool.includes(q))?'flex':'none';});});
  window.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#navSearch').focus();}});
  $('#themeToggle').addEventListener('click',()=>{document.documentElement.classList.toggle('dark'); localStorage.setItem('biobenchDark',document.documentElement.classList.contains('dark'));});
  if(localStorage.getItem('biobenchDark')==='true')document.documentElement.classList.add('dark');
  renderHome();
}

document.addEventListener('click',e=>{const c=e.target.closest('.copy-btn'); if(c&&!c.id){navigator.clipboard?.writeText(c.dataset.copy||'').then(()=>showToast('Copied'));}});
init();

  </script>
</body>
</html>
